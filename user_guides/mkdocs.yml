site_name: Inertia
site_description: A keyframe animation editor with SwiftUI, Jetpack Compose and React runtimes for animating real UI.
site_url: https://inertiagraphics.org/
repo_url: https://github.com/hpennington/Inertia
repo_name: hpennington/Inertia
copyright: Copyright &copy; 2026 Vector Studio (Hayden Pennington)

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Match system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/motion-play-outline
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Choosing a runtime: getting-started/runtimes.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Editor mode: getting-started/editor-mode.md
  - Using the editor:
      - Editor tour: editor/overview.md
      - Projects: editor/projects.md
      - Timeline and keyframes: editor/timeline.md
      - Drawing vectors: editor/drawing.md
  - Guides:
      - Animation files: guides/animation-file.md
      - Triggering animations: guides/triggering.md
      - Animation IDs: guides/ids.md
  - Reference:
      - SwiftUI API: reference/swiftui-api.md
      - Compose API: reference/compose-api.md
      - React API: reference/react-api.md
      - Animatable values: reference/values.md
  - Troubleshooting: troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hpennington
      name: Inertia on GitHub
  generator: false
